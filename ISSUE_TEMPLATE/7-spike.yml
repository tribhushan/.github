name: Spike
description: Research or proof of concept
type: Spike
projects: ["tribhushan/1"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations: { required: true }
  - type: input
    id: timebox
    attributes:
      label: Timebox
      placeholder: "e.g. 2 hours"
    validations: { required: true }
  - type: textarea
    id: output
    attributes:
      label: Expected output
      placeholder: "Decision record (ADR), comparison table, prototype …"
