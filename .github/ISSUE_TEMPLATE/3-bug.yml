name: Bug
description: Something does not work as expected
type: Bug
projects: ["tribhushan/1"]
body:
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
    validations: { required: true }
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options: [Dev, Test, Prod]
    validations: { required: true }
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: ["S1 – blocks work, no workaround", "S2 – major, workaround exists", "S3 – minor", "S4 – cosmetic"]
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs (no secrets)
