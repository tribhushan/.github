name: Feature
description: A user story or new capability
type: Feature
projects: ["tribhushan/1"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: "As a <role>, I want <capability>, so that <benefit>."
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable conditions. Each one becomes a test.
      placeholder: "- Given … when … then …"
    validations: { required: true }
  - type: textarea
    id: scope
    attributes:
      label: Out of scope / future scope
  - type: textarea
    id: notes
    attributes:
      label: Notes, designs, links
